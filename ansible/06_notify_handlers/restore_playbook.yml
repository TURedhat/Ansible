---
- name: Restore playbook.yml
  hosts: all
  gather_facts: false
  tasks:     
    - name: 1) DB 서비스 종료
      ansible.builtin.systemd_service: 
        name: mariadb
        state: stopped
        enabled: false
      ignore_errors: true

    - name: 2) DB 패키지 제거
      ansible.builtin.dnf: 
        name: 
          - mariadb
          - mariadb-server
          - python3-PyMySQL
        state: absent 
