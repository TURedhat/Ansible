---
- name: 0) 사용자 정의 팩트 배포
  hosts: web1
  gather_facts: false
  vars: 
    remote_dir: /etc/ansible/facts.d
    facts_file: files/custom.fact
  tasks: 
    #########################
    # 1) /etc/ansible/facts.d 디렉토리 생성
    # 2) /etc/ansible/facts.d/custom.fact 파일 배포
    # → 디렉터리와 파일의 기본 권한은 755 & 644지만 umask값이 잘못 되어있는 경우를 대비하여 지정
    #########################
    - name: 1) /etc/ansible/facts.d 디렉터리 생성
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0755'

    - name: 2) /etc/ansible/facts.d/custom.fact 파일 배포
      ansible.builtin.copy: 
        src: "{{ facts_file }}"
        dest: "{{ remote_dir }}"
        mode: '0644'
