###########################
# 1. Play01: web, php, db 구현
#   1) WEB + PHP + Firewall
#   2) DB(MariaDB)
# 2. Play02: 웹 요청
#   1) 웹 요청
###########################

#
# 1. Play01: web, php, db 구현
#
- name: 1. Play01_WEB-PHP-DB 구현
  hosts: webservers
  tasks: 
    #   1) WEB + PHP + Firewall 
    #   * 패키지 설치
    #   * 서비스 설정
    #   * 서비스 기동
    #   * 방화벽 등록
    - name: 1) 패키지 설치 - httpd, mod_ssl, php, php-mysqlnd, php-pdo, firewalld
      ansible.builtin.dnf:
        name: 
          - httpd
          - mod_ssl
          - php
          - php-mysqlnd
          - php-pdo
          - firewalld
        state: present

    - name: 서비스 설정 - /var/www/html/index.php
      ansible.builtin.get_url:
        url: http://192.168.10.10/index.php.txt
        dest: /var/www/html/index.php
        mode: '0644'

    - name: 서비스 기동 - httpd, firewalld
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - httpd
        - firewalld

    - name: 방화벽 등록 - http, https
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - http
        - https

    #   2) DB(MariaDB) > DB는 서비스 기동 하고 내부에서 설정해야 함.
    #   * 패키지 설치
    #   * 서비스 기동
    #   * 서비스 설정
    #   * 방화벽 등록


