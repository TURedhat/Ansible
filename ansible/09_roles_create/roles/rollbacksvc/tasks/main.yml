---
# tasks file for rollbacksvc
#########################################
# 1) 방화벽 포트 제거 - ex) http, https
# 2) 서비스 종료 - ex) httpd, firewalld 
# 3) 디렉토리/파일 삭제 - ex) /var/www/html/index.html
# 4) 패키지 삭제 - ex) httpd, mod_ssl 
#########################################
- name: 1) 방화벽 포트 제거 - "{{ fw_svcs }}"
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop: "{{ fw_svcs }}"
  ignore_errors: true

- name: 2) 서비스 종료 - "{{ svcs }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ svcs }}"
  ignore_errors: true

# 위에 두개는 변수 없어도 rollbacksvc/defaults에서 받아오는데
# 얘는 없으면 실행 안 함
- name: 3) 디렉토리/파일 삭제 - "{{ myfiles }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ myfiles }}"

- name: 4) 패키지 삭제 - "{{ pkgs }}"
  ansible.builtin.dnf:
    name: "{{ pkgs }}"
    state: absent