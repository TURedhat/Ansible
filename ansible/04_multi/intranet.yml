---
######################
# 1. 웹 서버 설정 - web1
# * 1) 패키지 설치
# * 2) 서비스 설정
# * 3) 서비스 기동
# * 4) 방화벽 등록
# 
# 2. 웹 확인 - localhost → web1
# * 1) 웹 요청
######################

#
# 1. 웹 서버 설정 - web1
#
- name: 1) 웹 서버 설정 - web1.example.com
  hosts: webservers
  tasks: 
    # * 1) 패키지 설치 - dnf(httpd)
    #   # dnf install -y httpd
    - name: 1) 패키지 설치 - dnf(httpd, firewalld)
      ansible.builtin.dnf:
        name: 
          - httpd
          - firewalld
        state: present

    # * 2) 서비스 설정 - copy(/var/www/html/index.html)
    #   # scp files/index.html web1:/var/www/html/index.html
    - name: 2) 서비스 설정
      ansible.builtin.copy:
        src: files/index.html
        dest: /var/www/html/index.html
        mode: '0644'

    # * 3) 서비스 기동 - systemd_service / service(httpd, firewalld)
    #   # systemctl enable --now httpd / systemctl enable --now firewalld
    - name: 3-1) 서비스 기동 - httpd
      ansible.builtin.systemd_service:
        name: httpd
        state: started
        enabled: true

    - name: 3-2) 서비스 기동 - firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        state: started
        enabled: true

    # * 4) 방화벽 등록 - firewalld(http(80/tcp))
    #   # firewall-cmd --permanent --add-service=http
    #   # firewall-cmd --add-service=http
    #   # firewall-cmd --reload
    - name: 4) 방화벽 등록 - http
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true

# 
# 2. 웹 확인 - localhost → web1
#
# * 1) 웹 요청 - uri(http://web1.example.com)
#   # curl http://web1.example.com
# * 2) 웹 응답

- name: 2. 웹 확인
  hosts: localhost
  become: false       # curl 명령어 쓰는데 root 권한 필요 없음.
  tasks:
    - name: 1) 웹 요청 - http://web1.example.com
      ansible.builtin.uri:
        url: http://web1.example.com
        return_content: true
      register: html          # 값이 이 변수 안에 들어옴
    
    - name: 2) 웹 응답
      ansible.builtin.debug:
        var: html.content
