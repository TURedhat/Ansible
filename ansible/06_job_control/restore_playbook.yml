---
- name: Restore playbook.yml
  hosts: all
  gather_facts: false
  vars:
    web_package: httpd
    db_package: mariadb-server
    db_service: mariadb
  tasks:
    - name: stop {{ db_service }} service
      ansible.builtin.systemd.service: 
        name: "{{ db_service }}"
        state: stopped
        enabled: false

    - name: Remove the {{ web_package }} packages
      ansible.builtin.yum:
        name:
          - "{{ web_package }}"
          - "{{ db_package }}"
        state: present